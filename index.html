<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Motion Impostor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000; width: 100vw; height: 100vh;
      overflow: hidden;
      -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
    }
    #video-container { position: fixed; inset: 0; z-index: 1; }
    #video-container iframe { width: 100%; height: 100%; border: none; }
    #overlay {
      position: fixed; inset: 0; display: flex;
      justify-content: center; align-items: center; z-index: 10; cursor: pointer;
    }
    #playBtn {
      background: transparent; border: 2px solid #fff; color: #fff;
      font-size: 1.2rem; padding: 16px 40px; border-radius: 50px;
      letter-spacing: 2px; pointer-events: none; font-family: sans-serif;
    }
    .top-btn {
      position: fixed; top: 20px; z-index: 20; display: none;
      background: transparent; border: 2px solid #fff; color: #fff;
      font-size: 0.75rem; padding: 8px 18px; border-radius: 50px;
      letter-spacing: 1.5px; cursor: pointer; font-family: sans-serif;
      -webkit-touch-callout: none;
    }
    #soundBtn { right: 20px; }
    #subBtn   { right: 148px; }
    #openReadBtn {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
      z-index: 20; display: none;
      background: transparent; border: 2px solid #fff; color: #fff;
      font-size: 0.85rem; padding: 10px 28px; border-radius: 50px;
      letter-spacing: 2px; cursor: pointer; font-family: sans-serif;
      -webkit-touch-callout: none;
      animation: fadeUp 0.4s ease;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateX(-50%) translateY(10px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }
    #subtitle {
      position: fixed; bottom: 28px;
      left: 50%; transform: translateX(-50%);
      width: max-content; max-width: 88vw;
      z-index: 15; pointer-events: none;
      color: #fff; font-family: sans-serif; font-size: 0.88rem;
      text-align: center; line-height: 1.75;
      display: none;
    }
    .sub-line {
      display: inline;
      background: rgba(10,10,10,0.45);
      -webkit-box-decoration-break: clone;
      box-decoration-break: clone;
      padding: 0.1em 0.45em 0.15em;
      border-radius: 3px;
      white-space: pre-wrap;
    }
    #click-layer { position: fixed; inset: 0; z-index: 5; display: none; -webkit-touch-callout: none; }
    #pauseIndicator {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #fff; font-family: sans-serif; font-size: 1rem;
      letter-spacing: 2px; opacity: 0; z-index: 15;
      pointer-events: none; transition: opacity 0.3s;
    }
    #guide {
      position: fixed; inset: 0; background: rgba(70,70,70,0.58);
      z-index: 30; display: none; cursor: pointer; -webkit-touch-callout: none;
    }
    .g-label {
      position: absolute; color: #fff; font-family: sans-serif;
      font-size: 0.78rem; letter-spacing: 1px; line-height: 1.8; pointer-events: none;
    }
    #guide-dismiss {
      position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.55); font-family: sans-serif;
      font-size: 0.7rem; letter-spacing: 1px; white-space: nowrap; pointer-events: none;
    }
  </style>
</head>
<body>

<div id="video-container">
  <iframe id="vimeoFrame"
    src="https://player.vimeo.com/video/1191526028?badge=0&autopause=0&player_id=0&app_id=58479&controls=0&autoplay=0&muted=1"
    allow="autoplay; fullscreen; picture-in-picture" allowfullscreen>
  </iframe>
</div>

<div id="overlay"><button id="playBtn">PLAY</button></div>
<button id="soundBtn" class="top-btn">SOUND OFF</button>
<button id="subBtn"   class="top-btn">SUB ENG</button>
<div id="subtitle"></div>
<button id="openReadBtn">เปิดอ่าน</button>
<div id="click-layer"></div>
<div id="pauseIndicator">PAUSED</div>

<div id="guide">
  <svg style="position:absolute;top:54px;right:22px;width:22px;height:36px;" viewBox="0 0 22 36" pointer-events="none">
    <line x1="11" y1="32" x2="11" y2="4" stroke="white" stroke-width="2"/>
    <polyline points="4,12 11,2 18,12" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/>
  </svg>
  <div class="g-label" style="top:94px;right:8px;text-align:right;">เปิด / ปิด เสียง</div>

  <svg style="position:absolute;top:54px;right:150px;width:22px;height:36px;" viewBox="0 0 22 36" pointer-events="none">
    <line x1="11" y1="32" x2="11" y2="4" stroke="white" stroke-width="2"/>
    <polyline points="4,12 11,2 18,12" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/>
  </svg>
  <div class="g-label" style="top:94px;right:118px;text-align:right;">ซับไตเติ้ลภาษาอังกฤษ</div>

  <svg style="position:absolute;top:calc(50% - 100px);left:calc(50% - 11px);width:22px;height:36px;" viewBox="0 0 22 36" pointer-events="none">
    <line x1="11" y1="32" x2="11" y2="4" stroke="white" stroke-width="2"/>
    <polyline points="4,12 11,2 18,12" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/>
  </svg>
  <div class="g-label" style="top:calc(50% - 56px);left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap;">
    แตะหน้าจอ 1 ครั้ง<br>หยุด / เล่นต่อ
  </div>

  <div class="g-label" style="top:50%;right:8px;transform:translateY(20px);text-align:right;">
    กดค้างด้านขวา<br>เพื่อเร่ง 2×
  </div>
  <svg style="position:absolute;top:50%;right:106px;transform:translateY(28px);width:36px;height:20px;" viewBox="0 0 36 20" pointer-events="none">
    <line x1="2" y1="10" x2="30" y2="10" stroke="white" stroke-width="2"/>
    <polyline points="22,3 32,10 22,17" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/>
  </svg>

  <div class="g-label" style="top:50%;left:8px;transform:translateY(20px);text-align:left;">
    กดค้างด้านซ้าย<br>เพื่อกรอย้อนหลัง
  </div>
  <svg style="position:absolute;top:50%;left:120px;transform:translateY(28px);width:36px;height:20px;" viewBox="0 0 36 20" pointer-events="none">
    <line x1="34" y1="10" x2="6" y2="10" stroke="white" stroke-width="2"/>
    <polyline points="14,3 4,10 14,17" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/>
  </svg>

  <div id="guide-dismiss">แตะที่ไหนก็ได้เพื่อปิดและเริ่มเล่น</div>
</div>

<script src="https://player.vimeo.com/api/player.js"></script>
<script>
// Timecodes from Thai script (seconds). Clip = 4:35 = 275s
const subs = [
  // 0:00–0:08
  { s:0,   e:4,   t:"Does it ever wear you out..." },
  { s:4,   e:8,   t:"...having to be 'the capable one' all the time?" },
  // 0:08–0:21
  { s:8,   e:13,  t:"After a long day, you finally sit down to rest." },
  { s:13,  e:17,  t:"Every single day, you push yourself to prove your worth." },
  { s:17,  e:21,  t:"The exhaustion catches up, and you fall asleep." },
  // 0:23–0:31
  { s:23,  e:28,  t:"You slip into another world —" },
  { s:28,  e:32,  t:"one that feels strangely unfamiliar." },
  // 0:32–0:40
  { s:32,  e:36,  t:"You find yourself in a vast forest." },
  { s:36,  e:38,  t:"It's full of hardworking ants —" },
  { s:38,  e:41,  t:"and you can talk to all of them." },
  // 0:36–0:38
  { s:41,  e:44,  t:"\"Where are you all heading?\"" },
  // 0:41–0:52
  { s:44,  e:49,  t:"\"We've been out foraging." },
  { s:49,  e:54,  t:"A flood hit — we can't find our way back." },
  { s:54,  e:57,  t:"Could you help us get home?\" — \"Of course.\"" },
  // 0:54–1:03
  { s:57,  e:61,  t:"You follow them quietly past this clear, still stream." },
  { s:61,  e:63,  t:"You stop to look at your own reflection." },
  { s:63,  e:64,  t:"And then... something slowly surfaces." },
  // 1:04–1:20
  { s:64,  e:67,  t:"In truth — this is the Stream of Thoughts." },
  { s:67,  e:70,  t:"Whatever you believe, it appears here." },
  { s:70,  e:73,  t:"\"Someone else would have done this so much better.\"" },
  { s:73,  e:76,  t:"\"Honestly, I'm not that talented.\"" },
  { s:76,  e:79,  t:"\"If they knew the truth... they'd be so disappointed.\"" },
  { s:79,  e:82,  t:"\"I only got here because of luck.\"" },
  { s:82,  e:86,  t:"\"I just haven't tried hard enough.\"" },
  // 1:26–1:28
  { s:86,  e:88,  t:"Having these thoughts —" },
  { s:88,  e:99,  t:"you are not alone." },
  // 1:30–1:39
  { s:90,  e:96,  t:"70% of people have felt they weren't truly capable..." },
  { s:96,  e:102, t:"...or that they didn't deserve the success they'd earned." },
  { s:102, e:108, t:"Even highly successful people face this." },
  { s:108, e:114, t:"It's called Impostor Syndrome." },
  { s:114, e:120, t:"\"And it can be worked through —" },
  { s:120, e:126, t:"once you understand where it comes from.\"" },
  // 1:40–1:51
  { s:100, e:107, t:"You arrive at a rocky clearing in the forest." },
  { s:107, e:111, t:"A shaft of light reveals... a massive ant colony." },
  // 1:52–2:02
  { s:112, e:120, t:"But you never got to know the ants who walked with you." },
  { s:120, e:122, t:"Maybe it's worth a closer look —" },
  { s:122, e:126, t:"you might find something familiar." },
  // 2:06–2:17 The Expert
  { s:126, e:128, t:"The Expert." },
  { s:128, e:133, t:"Needs to know everything before acting." },
  { s:133, e:137, t:"Terrified of being seen as incompetent." },
  { s:137, e:142, t:"Deeply anxious when they can't answer something." },
  // 2:22–2:28 The Superhuman
  { s:142, e:148, t:"The Superhuman." },
  { s:148, e:153, t:"Tries to excel at everything, all at once." },
  { s:153, e:156, t:"Forgets that limits exist." },
  { s:156, e:160, t:"One mistake feels like total failure." },
  // 2:29–2:40 The Soloist
  { s:149, e:161, t:"" }, // overlap guard
  { s:161, e:163, t:"The Soloist." },
  { s:163, e:167, t:"Believes that asking for help means you're weak." },
  { s:167, e:172, t:"So they carry everything alone — even when it's far too much." },
  // 2:43–2:53 The Natural Genius
  { s:163, e:173, t:"" }, // overlap guard
  { s:173, e:175, t:"The Natural Genius." },
  { s:175, e:181, t:"Expects to get things right on the very first try." },
  { s:181, e:185, t:"If it takes effort — or goes wrong —" },
  { s:185, e:189, t:"they feel they're not truly gifted." },
  // 2:55–3:01 The Perfectionist
  { s:175, e:181, t:"" }, // overlap guard
  { s:181, e:183, t:"The Perfectionist." },
  { s:183, e:189, t:"Sets impossibly high standards. No mistakes allowed." },
  { s:189, e:197, t:"Even the smallest slip feels like proof they're 'still not good enough.'" },
  // 3:04–3:10
  { s:184, e:190, t:"Each of these five types has a name and origin." },
  { s:190, e:197, t:"Curious what they're called?" },
  // 3:13–3:26
  { s:193, e:198, t:"Impostor Syndrome is not a disorder." },
  { s:198, e:204, t:"It's a pattern of thinking that can affect absolutely anyone —" },
  { s:204, e:208, t:"students, professionals, and even highly successful people." },
  // 3:27–3:36
  { s:207, e:212, t:"Having these thoughts is nobody's fault." },
  { s:212, e:216, t:"It often comes from a mix of things:" },
  { s:216, e:221, t:"high expectations placed on you," },
  { s:221, e:224, t:"constantly comparing yourself to others," },
  { s:224, e:227, t:"a culture that rewards achievement above all else," },
  { s:227, e:232, t:"and a social media feed full of everyone else's highlights." },
  // 3:37–3:59
  { s:217, e:224, t:"Impostor Syndrome is nothing to be afraid of." },
  { s:224, e:230, t:"You just have to understand it — and make peace with it." },
  { s:230, e:236, t:"You don't have to be perfect all the time." },
  { s:236, e:239, t:"You just have to be you — a you that is still growing." },
  // 4:01–4:08
  { s:241, e:247, t:"You follow the path all the way to its end." },
  { s:247, e:253, t:"Before parting ways, one of the ants hands you something." },
  // 4:11–4:19
  { s:251, e:256, t:"Every mistake you've made." },
  { s:256, e:261, t:"Every moment you've doubted yourself." },
  { s:261, e:267, t:"All of it has shaped you into who you are today —" },
  { s:267, e:273, t:"and that version of you is the strongest one yet." },
  // resources
  { s:251, e:260, t:"If you'd like to talk to someone:\nMental Health Hotline: 1323\nSWU SMILE: 02 258 9105 | LINE @swusmile\n(for SWU students)" },
  // credits 4:20–4:34
  { s:260, e:275, t:"Senior Project — Communication Innovation\nKalta Setworphat & Issada-on Muktad\nHealth Communication, COSCI, SWU\n\nAdvisor: Asst. Prof. Apirapee Settharuk Tancharoenwong\nCommittee: Asst. Prof. Dr. Srirath Pakdeeronachit\nAsst. Prof. Dr. Chanonya Chaiwongroj · Dr. Supkanate Chunhasiriruk\n\nInspired by Dr. Valerie Young's 5 Competence Types" },
];

const overlayEl   = document.getElementById('overlay');
const clickLayer  = document.getElementById('click-layer');
const soundBtn    = document.getElementById('soundBtn');
const subBtn      = document.getElementById('subBtn');
const subtitleEl  = document.getElementById('subtitle');
const openReadBtn = document.getElementById('openReadBtn');
const iframe      = document.getElementById('vimeoFrame');
const guide       = document.getElementById('guide');
const pauseInd    = document.getElementById('pauseIndicator');

let player, isMuted=true, isPaused=false, subOn=true;
let isHolding=false, holdTimer=null, rewindInterval=null;
let currentTime=0, openReadShown=false, openReadDismissed=false;
let lastSubText = '';

function updateSubtitle(t) {
  if (!subOn) {
    if (subtitleEl.innerHTML !== '') subtitleEl.innerHTML = '';
    return;
  }
  const found = subs.find(s => t >= s.s && t < s.e);
  const newText = found ? found.t : '';
  if (newText !== lastSubText) {
    lastSubText = newText;
    if (!newText) {
      subtitleEl.innerHTML = '';
    } else {
      // split by \n so multiline subs each get their own highlight span
      const lines = newText.split('\n');
      subtitleEl.innerHTML = lines.map(l => `<span class="sub-line">${l}</span>`).join('<br>');
    }
  }
}

overlayEl.addEventListener('click', function(){
  overlayEl.style.display='none';
  soundBtn.style.display='block';
  subBtn.style.display='block';
  subtitleEl.style.display='block';
  player = new Vimeo.Player(iframe);
  player.setMuted(true);
  guide.style.display='block';
});

guide.addEventListener('click', function(){
  guide.style.display='none';
  clickLayer.style.display='block';
  player.play();
  player.on('timeupdate', function(data){
    currentTime = data.seconds;
    updateSubtitle(currentTime);
    // ปุ่มเปิดอ่าน ขึ้นเร็วขึ้น ~4:04
    if (currentTime >= 243 && currentTime < 252 && !openReadShown && !openReadDismissed){
      openReadShown=true;
      openReadBtn.style.display='block';
    } else if ((currentTime < 243 || currentTime >= 252) && openReadShown){
      openReadShown=false;
      openReadBtn.style.display='none';
    }
  });
});

soundBtn.addEventListener('click', function(e){
  e.stopPropagation();
  if (!player) return;
  isMuted=!isMuted;
  player.setMuted(isMuted);
  if (!isMuted) player.setVolume(1);
  soundBtn.textContent = isMuted?'SOUND OFF':'SOUND ON';
});

subBtn.addEventListener('click', function(e){
  e.stopPropagation();
  subOn=!subOn;
  subBtn.textContent = subOn?'SUB ENG':'SUB OFF';
  if (!subOn) { subtitleEl.innerHTML=''; lastSubText=''; }
});

openReadBtn.addEventListener('click', function(e){
  e.stopPropagation();
  openReadBtn.style.display='none';
  openReadDismissed=true;
  if (player) player.setCurrentTime(251);
});

clickLayer.addEventListener('pointerdown', function(e){
  e.preventDefault();
  const isRight = e.clientX > window.innerWidth*0.6;
  const isLeft  = e.clientX < window.innerWidth*0.4;
  if (isRight){
    holdTimer = setTimeout(()=>{
      isHolding=true;
      if (player) player.setPlaybackRate(2);
    }, 200);
  } else if (isLeft){
    holdTimer = setTimeout(()=>{
      isHolding=true;
      if (!player) return;
      rewindInterval = setInterval(()=>{
        currentTime = Math.max(0, currentTime-0.25);
        player.setCurrentTime(currentTime);
      }, 100);
    }, 200);
  }
});

function stopHold(){
  clearTimeout(holdTimer);
  if (rewindInterval){ clearInterval(rewindInterval); rewindInterval=null; }
  if (isHolding && player) player.setPlaybackRate(1);
  isHolding=false;
}

clickLayer.addEventListener('pointerup', function(e){
  e.preventDefault();
  const wasHolding=isHolding;
  stopHold();
  if (wasHolding) return;
  if (!player) return;
  isPaused=!isPaused;
  isPaused?player.pause():player.play();
  pauseInd.style.opacity=isPaused?'1':'0';
});

clickLayer.addEventListener('pointerleave', stopHold);
clickLayer.addEventListener('pointercancel', stopHold);
</script>

</body>
</html>
