<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Motion Impostor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; width: 100vw; height: 100vh; overflow: hidden; }

    #video-container { position: fixed; inset: 0; z-index: 1; }
    #video-container iframe { width: 100%; height: 100%; border: none; }

    #overlay {
      position: fixed; inset: 0;
      display: flex; justify-content: center; align-items: center;
      z-index: 10; cursor: pointer;
    }
    #playBtn {
      background: transparent; border: 2px solid #fff; color: #fff;
      font-size: 1.2rem; padding: 16px 40px; border-radius: 50px;
      letter-spacing: 2px; pointer-events: none; font-family: sans-serif;
      transition: background 0.3s;
    }
    #overlay:hover #playBtn { background: rgba(255,255,255,0.15); }

    #soundBtn {
      position: fixed; top: 20px; right: 20px; z-index: 20; display: none;
      background: transparent; border: 2px solid #fff; color: #fff;
      font-size: 0.75rem; padding: 8px 18px; border-radius: 50px;
      letter-spacing: 1.5px; cursor: pointer; font-family: sans-serif;
      transition: background 0.3s;
    }
    #soundBtn:hover { background: rgba(255,255,255,0.15); }

    #click-layer { position: fixed; inset: 0; z-index: 5; display: none; cursor: pointer; }

    #pauseIndicator {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      color: #fff; font-family: sans-serif; font-size: 1rem;
      letter-spacing: 2px; opacity: 0; z-index: 15;
      pointer-events: none; transition: opacity 0.3s;
    }

    #guide {
      position: fixed; inset: 0;
      background: rgba(70,70,70,0.58);
      z-index: 30; display: none; cursor: pointer;
    }
    .g-label {
      position: absolute; color: #fff; font-family: sans-serif;
      font-size: 0.78rem; letter-spacing: 1px; line-height: 1.8;
    }
    #guide-dismiss {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.55); font-family: sans-serif;
      font-size: 0.7rem; letter-spacing: 1px; white-space: nowrap;
    }
  </style>
</head>
<body>

<div id="video-container">
  <iframe id="vimeoFrame"
    src="https://player.vimeo.com/video/1178206165?badge=0&autopause=0&player_id=0&app_id=58479&controls=0&autoplay=0&muted=1"
    allow="autoplay; fullscreen; picture-in-picture" allowfullscreen>
  </iframe>
</div>

<div id="overlay">
  <button id="playBtn">PLAY</button>
</div>

<button id="soundBtn">SOUND OFF</button>

<div id="click-layer"></div>
<div id="pauseIndicator">PAUSED</div>

<div id="guide">

  <!-- Sound: arrow pointing up-right toward button -->
  <svg style="position:absolute;top:14px;right:68px;width:32px;height:44px;" viewBox="0 0 32 44">
    <line x1="16" y1="40" x2="16" y2="6" stroke="white" stroke-width="2"/>
    <polyline points="8,14 16,4 24,14" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/>
  </svg>
  <div class="g-label" style="top:60px;right:14px;text-align:right;">เปิด / ปิด เสียง</div>

  <!-- Tap to pause: arrow pointing up, center -->
  <svg style="position:absolute;top:calc(50% - 110px);left:calc(50% - 12px);width:24px;height:40px;" viewBox="0 0 24 40">
    <line x1="12" y1="36" x2="12" y2="4" stroke="white" stroke-width="2"/>
    <polyline points="4,12 12,2 20,12" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/>
  </svg>
  <div class="g-label" style="top:calc(50% - 58px);left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap;">
    แตะหน้าจอ 1 ครั้ง<br>หยุด / เล่นต่อ
  </div>

  <!-- Hold right: arrow pointing right -->
  <div class="g-label" style="top:50%;right:14px;transform:translateY(-50%);text-align:right;">
    กดค้างด้านขวา<br>เพื่อเร่ง 1.5×<br><span style="font-size:0.65rem;opacity:0.75;">(เสียงปิดชั่วคราว)</span>
  </div>
  <svg style="position:absolute;top:50%;right:114px;transform:translateY(-50%);width:40px;height:24px;" viewBox="0 0 40 24">
    <line x1="4" y1="12" x2="34" y2="12" stroke="white" stroke-width="2"/>
    <polyline points="26,4 36,12 26,20" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/>
  </svg>

  <!-- Hold left: arrow pointing left -->
  <div class="g-label" style="top:50%;left:14px;transform:translateY(-50%);text-align:left;">
    กดค้างด้านซ้าย<br>เพื่อกรอย้อนหลัง<br><span style="font-size:0.65rem;opacity:0.75;">(เสียงปิดชั่วคราว)</span>
  </div>
  <svg style="position:absolute;top:50%;left:130px;transform:translateY(-50%);width:40px;height:24px;" viewBox="0 0 40 24">
    <line x1="36" y1="12" x2="6" y2="12" stroke="white" stroke-width="2"/>
    <polyline points="14,4 4,12 14,20" fill="none" stroke="white" stroke-width="2" stroke-linejoin="round"/>
  </svg>

  <div id="guide-dismiss">แตะที่ไหนก็ได้เพื่อปิด</div>
</div>

<script src="https://player.vimeo.com/api/player.js"></script>
<script>
  const overlayEl   = document.getElementById('overlay');
  const clickLayer  = document.getElementById('click-layer');
  const soundBtn    = document.getElementById('soundBtn');
  const iframe      = document.getElementById('vimeoFrame');
  const guide       = document.getElementById('guide');
  const pauseInd    = document.getElementById('pauseIndicator');

  let player;
  let isMuted   = true;
  let isPaused  = false;
  let skipReady = false;
  let skipped   = false;
  let isHolding = false;
  let holdTimer = null;
  let rewindInterval = null;

  overlayEl.addEventListener('click', function () {
    overlayEl.style.display = 'none';
    clickLayer.style.display = 'block';
    soundBtn.style.display = 'block';

    player = new Vimeo.Player(iframe);
    player.setMuted(true).then(() => player.play());

    player.on('timeupdate', function (data) {
      const t = data.seconds;
      if (t >= 7 && t < 8.85) { skipReady = true; }
      else if (t >= 8.85) { skipReady = false; skipped = false; }
    });

    setTimeout(() => { guide.style.display = 'block'; }, 600);
  });

  guide.addEventListener('click', () => { guide.style.display = 'none'; });

  soundBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    if (!player) return;
    isMuted = !isMuted;
    player.setMuted(isMuted);
    if (!isMuted) player.setVolume(1);
    soundBtn.textContent = isMuted ? 'SOUND OFF' : 'SOUND ON';
  });

  clickLayer.addEventListener('pointerdown', function (e) {
    if (guide.style.display === 'block') return;
    const isRight = e.clientX > window.innerWidth * 0.6;
    const isLeft  = e.clientX < window.innerWidth * 0.4;

    if (isRight) {
      holdTimer = setTimeout(() => {
        isHolding = true;
        if (!player) return;
        player.setMuted(true);
        player.setPlaybackRate(1.5);
      }, 200);
    } else if (isLeft) {
      holdTimer = setTimeout(() => {
        isHolding = true;
        if (!player) return;
        player.setMuted(true);
        rewindInterval = setInterval(() => {
          player.getCurrentTime().then(t => {
            player.setCurrentTime(Math.max(0, t - 0.3));
          });
        }, 100);
      }, 200);
    }
  });

  function stopHold() {
    clearTimeout(holdTimer);
    clearInterval(rewindInterval);
    rewindInterval = null;

    if (isHolding && player) {
      player.setPlaybackRate(1);
      player.setMuted(isMuted);
      if (!isMuted) player.setVolume(1);
    }
    isHolding = false;
  }

  clickLayer.addEventListener('pointerup', function (e) {
    const wasHolding = isHolding;
    stopHold();
    if (wasHolding) return;
    if (!player) return;

    if (skipReady && !skipped) {
      skipped = true;
      player.setCurrentTime(8.85);
      return;
    }

    isPaused = !isPaused;
    isPaused ? player.pause() : player.play();
    pauseInd.style.opacity = isPaused ? '1' : '0';
  });

  clickLayer.addEventListener('pointerleave', stopHold);
  clickLayer.addEventListener('pointercancel', stopHold);
</script>

</body>
</html>
